name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meeting-core-linux:
    name: MeetingCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/MeetingCore

  ios-app:
    name: iOS app build (Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: MeetingCore tests (macOS)
        run: swift test --package-path Packages/MeetingCore

      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project EarToNote.xcodeproj \
            -scheme EarToNote \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
