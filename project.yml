name: EarToNote

options:
  bundleIdPrefix: com.eartonote
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.0
  MeetingCore:
    path: Packages/MeetingCore

targets:
  EarToNote:
    type: application
    platform: iOS
    sources:
      - path: EarToNote
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: MeetingCore
        product: MeetingCore
    info:
      path: EarToNote/Info.plist
      properties:
        CFBundleDisplayName: EarToNote
        CFBundleDevelopmentRegion: tr
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Toplantıları kaydedebilmek için mikrofona erişim gerekiyor. Kayıtlar yalnızca bu cihazda saklanır.
        NSSpeechRecognitionUsageDescription: Kayıtlar cihaz üzerinde yazıya dökülür; ses hiçbir sunucuya gönderilmez.
        UIBackgroundModes:
          - audio
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).process.*
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eartonote.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

schemes:
  EarToNote:
    build:
      targets:
        EarToNote: all
    run:
      config: Debug
    archive:
      config: Release
